databases:
  - name: ado-palmwinery-db
    plan: free
    databaseName: ado_palmwinery
    user: ado_admin

services:
  - type: web
    name: ado-palmwinery
    runtime: node
    plan: free
    buildCommand: cd server && npm install --include=dev && npx prisma generate && npm run build && cd ../client && npm install && npm run build
    startCommand: cd server && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: ado-palmwinery-db
          property: connectionString
      - key: CLIENT_URL
        value: https://ado-palmwinery.onrender.com
      - key: TILO_PAY_API_KEY
        sync: false
      - key: TILO_PAY_SECRET_KEY
        sync: false
      - key: TILO_PAY_BASE_URL
        value: https://api.tilopay.com/v1
