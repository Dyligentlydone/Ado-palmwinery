databases:
  - name: ado-palmwinery-db
    plan: free
    databaseName: ado_palmwinery
    user: ado_admin

services:
  - type: web
    name: ado-palmwinery
    runtime: node
    plan: free
    buildCommand: export NODE_ENV=development && cd server && npm install && npx prisma generate && npm run build && cd ../client && npm install && npm run build
    startCommand: cd server && npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: ado-palmwinery-db
          property: connectionString
      - key: CLIENT_URL
        value: https://ado-palmwinery.onrender.com
      - key: ONVO_SECRET_KEY
        sync: false
      - key: ONVO_WEBHOOK_SECRET
        sync: false
      - key: ONVO_BASE_URL
        value: https://api.onvopay.com
      # Required to bootstrap the first admin account. Set this in Render, then
      # change the password via /account after first login. Leaving unset skips seeding.
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      # Email (Resend). Without RESEND_API_KEY the app logs emails to stdout
      # instead of sending — safe for staging, but production needs the real key.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: ADO Palmwinery <no-reply@adopalmwinery.com>
      - key: ADMIN_ALERT_EMAIL
        value: info@adopalmwinery.com
